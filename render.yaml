services:
  - type: web
    name: invite-tool
    env: node
    region: singapore
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: ACCESS_TOKEN
        sync: false          # 访问口令（招聘同事共用，自定一个）
      - key: SMTP_PASS
        sync: false          # HR_Support@insightelectionhk.com 的 SMTP 授权码
      - key: MONGODB_URI
        sync: false          # 复用 Atlas 集群（存发送台账）
      - key: SMTP_USER
        value: HR_Support@insightelectionhk.com
      - key: SMTP_HOST
        value: smtp.exmail.qq.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_FROM_NAME
        value: 人力资源部
